<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>计划,任务,提醒</title>
    <link rel="stylesheet" href="style.css?v=8.0">
    <!-- PWA 配置及添加到手机主屏幕图标设置 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="Date_Reminder.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="计划任务提醒">
    <!-- 引入谷歌中文字体以获得清新的排版 -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="phone-wrapper">
        <div class="app-container">
            <!-- 第一页: 群组文件夹与卡片列表视图 -->
            <div id="view-folders" class="app-view">
                <!-- 顶部留白，给电话、时间留空位 -->
                <div class="status-bar-spacer"></div>

                <header class="view-header">
                    <div class="view-title-row">
                        <h1 class="view-title">节日,计划,任务提醒</h1>
                    </div>
                    <div class="header-actions">
                        <button id="btn-save" class="header-icon-btn" title="存档 Save">
                            <img src="设计风格/save.png" alt="Save" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                            <span class="fallback-icon">💾</span>
                        </button>
                        <button id="btn-import" class="header-icon-btn" title="导入数据">
                            <img src="设计风格/import_data.png" alt="Import" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                            <span class="fallback-icon">📥</span>
                        </button>
                        <button id="btn-new-group" class="header-icon-btn" title="新增群组 Folder">
                            <img src="设计风格/add_folder.png" alt="Add Folder" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                            <span class="fallback-icon">📁</span>
                        </button>
                        <button id="btn-add-card-top" class="header-icon-btn" title="新增提醒 Card">
                            <img src="设计风格/Add Remider .png" alt="Add Card" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                            <span class="fallback-icon">📋</span>
                        </button>
                    </div>
                </header>

                <!-- 新建提醒卡片的双排输入面板 -->
                <div id="add-card-panel" class="add-card-panel" style="display: none;">
                    <div class="add-card-form">
                        <div class="form-row">
                            <span class="form-label">事项:</span>
                            <input type="text" id="mobile-card-title-input" placeholder="输入事项名称" />
                        </div>
                        <div class="form-row date-selects-row">
                            <span class="form-label">时间:</span>
                            <div class="form-date-selectors">
                                <select id="mobile-card-day" class="mobile-date-select">
                                    <!-- 动态生成 01 - 31 -->
                                </select>
                                <select id="mobile-card-month" class="mobile-date-select">
                                    <option value="0">Jan 一月</option>
                                    <option value="1">Feb 二月</option>
                                    <option value="2">Mar 三月</option>
                                    <option value="3">Apr 四月</option>
                                    <option value="4">May 五月</option>
                                    <option value="5">Jun 六月</option>
                                    <option value="6">Jul 七月</option>
                                    <option value="7">Aug 八月</option>
                                    <option value="8">Sep 九月</option>
                                    <option value="9">Oct 十月</option>
                                    <option value="10">Nov 十一</option>
                                    <option value="11">Dec 十二</option>
                                </select>
                                <select id="mobile-card-year" class="mobile-date-select">
                                    <!-- 动态生成 1926 - 2126 -->
                                </select>
                            </div>
                        </div>
                        <div class="form-row date-selects-row">
                            <span class="form-label" style="text-align: right; padding-right: 4px;">到:</span>
                            <div class="form-date-selectors">
                                <select id="mobile-card-end-day" class="mobile-date-select">
                                    <!-- 动态生成 01 - 31 -->
                                </select>
                                <select id="mobile-card-end-month" class="mobile-date-select">
                                    <option value="0">Jan 一月</option>
                                    <option value="1">Feb 二月</option>
                                    <option value="2">Mar 三月</option>
                                    <option value="3">Apr 四月</option>
                                    <option value="4">May 五月</option>
                                    <option value="5">Jun 六月</option>
                                    <option value="6">Jul 七月</option>
                                    <option value="7">Aug 八月</option>
                                    <option value="8">Sep 九月</option>
                                    <option value="9">Oct 十月</option>
                                    <option value="10">Nov 十一</option>
                                    <option value="11">Dec 十二</option>
                                </select>
                                <select id="mobile-card-end-year" class="mobile-date-select">
                                    <!-- 动态生成 1926 - 2126 -->
                                </select>
                            </div>
                        </div>
                        <div class="form-actions-row">
                            <button id="btn-mobile-save-card" class="confirm-btn">确认新增</button>
                        </div>
                    </div>
                </div>

                <div class="view-content" id="sidebar-folders-container">
                    <!-- 文件夹和卡片内容由 JS 动态生成 -->
                </div>
            </div>

            <!-- 第二页: 日历大框架 -->
            <div id="view-calendar" class="app-view active">
                <!-- 顶部留白，给电话、时间留空位 -->
                <div class="status-bar-spacer"></div>

                <div class="calendar-border-wrapper">
                    <header class="calendar-header">
                        <div class="calendar-header-top">
                            <div class="date-selectors">
                                <select id="select-year" class="cute-select">
                                    <!-- 动态生成年份 -->
                                    <option value="2026" selected>2026</option>
                                </select>
                                <div class="month-nav">
                                    <button id="btn-month-prev" class="month-nav-btn" title="上一个月">‹</button>
                                    <select id="select-month" class="cute-select">
                                        <option value="0">Jan 一月</option>
                                        <option value="1">Feb 二月</option>
                                        <option value="2">Mar 三月</option>
                                        <option value="3">Apr 四月</option>
                                        <option value="4">May 五月</option>
                                        <option value="5" selected>Jun 六月</option>
                                        <option value="6">Jul 七月</option>
                                        <option value="7">Aug 八月</option>
                                        <option value="8">Sep 九月</option>
                                        <option value="9">Oct 十月</option>
                                        <option value="10">Nov 十一</option>
                                        <option value="11">Dec 十二</option>
                                    </select>
                                    <button id="btn-month-next" class="month-nav-btn" title="下一个月">›</button>
                                </div>
                                <select id="select-day" class="cute-select">
                                    <!-- 动态生成日期 -->
                                </select>
                            </div>
                            
                            <!-- 动态日期农历显示 -->
                            <div class="lunar-display" id="lunar-info-header">
                                丙午年 四月廿三 <span class="week-text weekday-1">星期一</span>
                            </div>
                        </div>

                        <div class="search-bar-wrapper" data-html2canvas-ignore="true">
                            <input type="text" id="search-input" placeholder="输入 : 任务名称">
                            <button id="btn-save-top" class="cute-btn">Save</button>
                            <button id="btn-refresh-top" class="cute-btn">Refresh</button>
                            <button id="btn-snapshot-top" class="icon-only-btn" title="截图 Save JPG" style="background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 27px; margin-left: auto;">
                                <img src="设计风格/snapshot.png" alt="📸" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" style="height: 100%; object-fit: contain; display: block; transition: transform 0.1s;" onmousedown="this.style.transform='scale(0.8)'" onmouseup="this.style.transform='scale(1)'" onmouseleave="this.style.transform='scale(1)'" />
                            </button>
                        </div>
                    </header>

                    <!-- 日历网格区域 -->
                    <div class="calendar-grid-wrapper">
                        <div class="calendar-days-grid" id="calendar-days">
                            <!-- 由 JS 动态填入日子 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 第三页: Notepad 视图 -->
            <div id="view-notepad" class="app-view">
                <div class="status-bar-spacer"></div>
                <div class="notepad-border-wrapper">
                    <header class="notepad-header">
                        <h1 class="notepad-title">Notepad</h1>
                        <div class="notepad-header-actions">
                            <button id="btn-notepad-add-folder" class="notepad-icon-btn" title="Add Folder">
                                <img src="设计风格/add notepad folder .png" alt="Add Folder" />
                            </button>
                            <button id="btn-notepad-add-file" class="notepad-icon-btn" title="Add File">
                                <img src="设计风格/Add File Icon .png" alt="Add File" />
                            </button>
                            <button id="btn-notepad-save" class="notepad-icon-btn" title="Save All">
                                <img src="设计风格/Notepad save  icon .png" alt="Save" />
                            </button>
                        </div>
                    </header>
                    <div class="notepad-content" id="notepad-folders-container">
                        <!-- Notepad 文件夹和文件内容 -->
                    </div>
                </div>
            </div>

            <!-- 第四页: Notepad 编辑器视图 -->
            <div id="view-notepad-editor" class="app-view">
                <div class="status-bar-spacer"></div>
                <div class="notepad-editor-border-wrapper">
                    <header class="editor-header">
                        <div class="editor-header-left" id="btn-editor-home">&lt; Home</div>
                        <div class="editor-header-right">
                            <div class="editor-header-action" id="btn-editor-save">Save</div>
                            <div class="editor-header-action" id="btn-editor-undo">&lt;</div>
                            <div class="editor-header-action" id="btn-editor-redo">&gt;</div>
                        </div>
                    </header>
                    <div class="editor-title-bar" id="editor-file-title">文件名称</div>
                    <textarea id="editor-textarea" class="editor-textarea" placeholder="在此输入内容..."></textarea>
                </div>
            </div>

            <!-- 第五页: 计算器视图 -->
            <div id="view-calculator" class="app-view">
                <div class="status-bar-spacer"></div>
                <div class="calc-border-wrapper">
                    <div class="calc-screen">
                        <div class="calc-expression" id="calc-expression"></div>
                        <div class="calc-result-row">
                            <div class="calc-sound-container" style="margin-right: auto; display: flex; align-items: center; gap: 5px;">
                                <button class="calc-sound-toggle" id="btn-calc-sound" title="开关声音" style="margin-right: 0;">🔊</button>
                                <input type="range" id="calc-volume-slider" class="calc-volume-slider" min="0" max="1" step="0.01" value="0.1" title="调整音量">
                            </div>
                            <div class="calc-result" id="calc-result">0</div>
                            <button class="calc-backspace" id="btn-calc-backspace">&lt;</button>
                        </div>
                    </div>
                    <div class="calc-keyboard">
                        <!-- 第一排 -->
                        <button class="calc-key calc-op row-1" data-val="÷"><span>÷</span></button>
                        <button class="calc-key calc-op row-1" data-val="x"><span>x</span></button>
                        <button class="calc-key calc-op row-1" data-val="-"><span>-</span></button>
                        <button class="calc-key calc-op row-1" data-val="+"><span>+</span></button>
                        
                        <!-- 第二排 -->
                        <button class="calc-key calc-num row-2" data-val="7"><span>7</span></button>
                        <button class="calc-key calc-num row-2" data-val="8"><span>8</span></button>
                        <button class="calc-key calc-num row-2" data-val="9"><span>9</span></button>
                        <button class="calc-key calc-op row-2" data-val="%"><span>%</span></button>
                        
                        <!-- 第三排 -->
                        <button class="calc-key calc-num row-3" data-val="4"><span>4</span></button>
                        <button class="calc-key calc-num row-3" data-val="5"><span>5</span></button>
                        <button class="calc-key calc-num row-3" data-val="6"><span>6</span></button>
                        <button class="calc-key calc-clear row-3" id="btn-calc-clear"><span>C</span></button>
                        
                        <!-- 第四排 (1,2,3) & 第五排 (00,0,.) 混排 -->
                        <button class="calc-key calc-num row-4" data-val="1"><span>1</span></button>
                        <button class="calc-key calc-num row-4" data-val="2"><span>2</span></button>
                        <button class="calc-key calc-num row-4" data-val="3"><span>3</span></button>
                        <button class="calc-key calc-equal" id="btn-calc-equal"><span>=</span></button>

                        <button class="calc-key calc-num row-5" data-val="00"><span>00</span></button>
                        <button class="calc-key calc-num row-5" data-val="0"><span>0</span></button>
                        <button class="calc-key calc-num row-5" data-val="."><span>.</span></button>
                    </div>
                </div>
            </div>

            <!-- 自定义右键/长按上下文菜单 (文件夹) -->
            <div id="folder-context-menu" class="context-menu" style="display: none;">
                <div class="context-menu-item" id="menu-rename">重命名</div>
                <div class="context-menu-item" id="menu-delete">删除</div>
            </div>

            <!-- 自定义右键/长按上下文菜单 (卡片) -->
            <div id="card-context-menu" class="context-menu" style="display: none;">
                <div class="context-menu-item" id="card-menu-rename">重命名</div>
                <div class="context-menu-item" id="card-menu-delete">删除</div>
            </div>

            <!-- 底部导航工具栏 -->
            <nav class="bottom-nav">
                <button class="nav-btn" id="nav-btn-memory-game" title="记忆宫殿" onclick="window.location.href='memory-game/index.html'">
                    <img src="设计风格/Memory Games Icon .png" alt="🧠" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon" style="display:none; font-size: 24px;">🧠</span>
                </button>
                <button class="nav-btn" id="nav-btn-calculator" title="计算器">
                    <img src="设计风格/cauculator icon.png" alt="🖩" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon">🖩</span>
                </button>
                <button class="nav-btn" id="nav-btn-notepad" title="Notepad">
                    <img src="设计风格/Notepad icon .png" alt="📝" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon">📝</span>
                </button>
                <button class="nav-btn" id="nav-btn-list" title="列表">
                    <img src="设计风格/提醒Folder Icon .png" alt="📂" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon">📂</span>
                </button>
                <button class="nav-btn active" id="nav-btn-calendar" title="日历">
                    <img src="设计风格/YueLi Icon.png" alt="📅" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon">📅</span>
                </button>
                <button class="nav-btn" id="btn-refresh" title="刷新 refresh">
                    <img src="设计风格/refresh.png" alt="🔄" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon">🔄</span>
                </button>
            </nav>

            <!-- Toast 提示容器 -->
            <div id="toast-container" class="toast-container" style="display: none;"></div>
        </div>
    </div>

    <!-- 用于公历农历精准转换的库 -->
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.4/lunar.min.js"></script>
    <!-- 用于网页截图导出的库 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="script.js?v=6.0"></script>
    <script>
        // 注册 PWA Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
