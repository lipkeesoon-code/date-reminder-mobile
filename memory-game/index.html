    <link rel="apple-touch-icon" href="../Date_Reminder.png">

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f0f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .app-container {
            width: 100%;
            height: 100%;
            max-width: 390px;
            max-height: 844px;
            margin: 0 auto;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
        }

        @media (max-width: 480px) {
            html, body {
                background-color: #ffffff;
            }
            .app-container {
                max-width: none;
                max-height: none;
                box-shadow: none;
            }
        }

        /* 顶部带有紫色边框的主内容区，占据除底部icon外的所有剩余空间 */
        .main-content {
            flex: 1;
            padding: 10px;
            background-color: #b592b3; /* 紫色外框背景色 */
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
            overflow: hidden; /* 让内容区自己管理溢出，不影响 nav */
        }

        /* 横向滑动容器 */
        .grid-slider-wrapper {
            flex: 1;
            min-height: 0;
            width: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none; /* 隐藏 Firefox 滚动条 */
            -ms-overflow-style: none; /* 隐藏 IE 滚动条 */
        }
        .grid-slider-wrapper::-webkit-scrollbar {
            display: none; /* 隐藏 Chrome/Safari 滚动条 */
        }
        
        .grid-slides {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 格子区域，自适应剩余高度，每一页默认8行5列（40格） */
        .grid-container {
            background-color: #ffffff;
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 每一行5个格子 */
            grid-template-rows: repeat(var(--grid-rows, 8), 1fr); /* 动态分配行高 */
            border-left: 1px solid #dcdcdc;
            border-top: 1px solid #dcdcdc;
            position: relative;
            width: 100%;
            height: 100%;
            flex-shrink: 0;
            scroll-snap-align: start;
            box-sizing: border-box;
        }

        /* 指示点容器 */
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 2px;
            height: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }
        
        .dot.active {
            background-color: #ffffff;
            transform: scale(1.2);
        }

        .cell {
            border-right: 1px solid #dcdcdc;
            border-bottom: 1px solid #dcdcdc;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            background-color: #ffffff;
        }

        /* 浮水印数字 (10, 20, 30, 40) - 动态生成在第 10, 20, 30, 40 格子的背景 */
        .cell.has-bg-num::before {
            content: attr(data-bg-num);
            position: absolute;
            font-size: 45px; /* 字体放大 40% (原 32px) */
            color: rgba(220, 220, 225, 0.7);
            font-weight: bold;
            z-index: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: calc(100% - 20px); /* 仅在上方图区域居中 */
            top: 0;
            left: 0;
        }

        .card-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            min-height: 0;
        }

        .card-content img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        /* 卡片底部名称和数字 label */
        .card-label {
            height: 20px; /* 增加一点高度容纳文字 */
            border-top: 1px solid #dcdcdc; /* 改为和外框一样的边线 */
            display: flex; /* 始终显示，画出所有格子的框架 */
            background-color: #ffffff; /* 白底 */
            z-index: 2;
            flex-shrink: 0;
            box-sizing: border-box;
            width: 100%;
        }

        .card-name {
            flex: 1; /* 左侧占据大部分空间 */
            border-right: 1px solid #dcdcdc; /* 中间的垂直分割线 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #384259; /* 深蓝色 */
            font-weight: bold;
            white-space: nowrap; /* 不换行 */
            overflow: hidden;    /* 溢出隐藏 */
        }

        .card-num {
            width: 35%; /* 右侧占据空间 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #539845; /* 绿色 */
            font-weight: bold;
        }

        /* 关闭状态时的遮挡色块 */
        .card-label.is-closed .card-name, 
        .card-label.is-closed .card-num {
            background-color: #939ebc;
            color: transparent;
        }

        /* 底部控制区 - 白底，紫色字 */
        .controls-container {
            background-color: #ffffff; /* 恢复白底 */
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #9e779a; /* 与外框颜色呼应的紫色字 */
            font-weight: 500;
            flex-shrink: 0;
            box-sizing: border-box;
            border-radius: 2px; /* 稍微给一点圆角 */
        }

        .control-col {
            display: flex;
            flex-direction: column;
            gap: 0; /* 减小上下间距 */
        }

        .control-col label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
            padding: 0; /* 去除上下内边距 */
            line-height: 1.2; /* 缩小行高 */
        }

        .control-col input[type="radio"] {
            margin: 0;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }
        
        .page-switcher {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-top: 4px;
        }
        .page-dots {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .page-dots input[type="radio"] {
            width: 12px;
            height: 12px;
            margin: 0 1px;
        }

        /* 底部 Icon 区域 - 去除白框，直接放图 */
        .footer-area {
            height: 75px;
            padding: 8px 10px;
            background-color: #e5e9f0;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .app-logo-img {
            height: 58px;
            object-fit: contain;
            cursor: pointer;
        }

        /* 底部导航工具栏模拟 */
        .bottom-nav {
            background-color: #dbe2ef;
            border-top: 1.5px solid #b2c2db;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            gap: 0;
            height: 68px;
            flex-shrink: 0;
            padding: 4px 2px;
            padding-bottom: max(4px, env(safe-area-inset-bottom));
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 58px;
            max-width: 16vw;
            height: 58px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            padding: 0;
            outline: none;
            opacity: 0.85; 
        }
        
        .nav-btn.active {
            opacity: 1;
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        .nav-btn img {
            width: 53px;
            max-width: 100%;
            height: 53px;
            object-fit: contain;
        }

        .fallback-icon {
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

    </style>
</head>

            </div>

        const CARD_BACKS = [
            'A .jpg', 'B .jpg', 'C.jpg', 'D.jpg', 
            'E .jpg', 'F .jpg', 'G.jpg', 'H .jpg'
        ];

        const sliderWrapper = document.getElementById('sliderWrapper');
        const gridSlides = document.getElementById('gridSlides');

        let currentCards = [];
        let isAllHidden = false; // 用于“全关”模式

        // 提取 109 个独立的卡牌身份（每个身份如果有多张图，随机抽一张）
        function getUniquePegs() {
            let pegs = [];
            
            // 1. 获取 00-00 到 00-09 的 10 张牌
            for (let i = 0; i <= 9; i++) {
                let numStr = i.toString().padStart(2, '0');
                const variants = MEMORY_CODES[numStr];
                if (variants) {
                    let dashVariants = variants.filter(v => v.file.startsWith('00-'));
                    if (dashVariants.length > 0) {
                        let randomVariant = dashVariants[Math.floor(Math.random() * dashVariants.length)];
                        pegs.push({ number: numStr, ...randomVariant });
                    }
                }
            }
            
            // 2. 获取 0001 到 0099 的 99 张牌
            for (let i = 1; i <= 99; i++) {
                let numStr = i.toString().padStart(2, '0');
                const variants = MEMORY_CODES[numStr];
                if (variants) {
                    let normalVariants = variants.filter(v => !v.file.startsWith('00-'));
                    if (normalVariants.length > 0) {
                        let randomVariant = normalVariants[Math.floor(Math.random() * normalVariants.length)];
                        pegs.push({ number: numStr, ...randomVariant });
                    }
                }
            }
            
            return pegs;
        }

        // 发牌逻辑
        function dealCards() {
            const rangeOpt = document.querySelector('input[name="range"]:checked').value;
            const repeatOpt = document.querySelector('input[name="repeat"]:checked').value;
            const countOpt = parseInt(document.querySelector('input[name="count"]:checked').value);
            
            // 获取所有 109 张卡牌（已随机剔除多余变种）
            let allPegs = getUniquePegs();
            
            // 确定可用卡片池
            let pool = [];
            allPegs.forEach(peg => {
                let num = parseInt(peg.number);
                let inRange = false;
                
                if (rangeOpt === 'all') {
                    inRange = true;
                } else if (rangeOpt === 'upper' && num <= 30) {
                    inRange = true;
                } else if (rangeOpt === 'mid' && num >= 30 && num <= 69) {
                    inRange = true;
                } else if (rangeOpt === 'lower' && num >= 60) {
                    inRange = true;
                }
                
                if (inRange) {
                    pool.push(peg);
                }
            });
            
            let result = [];
            if (repeatOpt === 'no-repeat') {
                // 不重复：打乱卡片池
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
                let takeCount = Math.min(countOpt, pool.length);
                for(let i = 0; i < takeCount; i++) {
                    result.push({ ...pool[i] }); // 浅拷贝，避免引用污染
                }
            } else {
                // 有重复：随机抽取卡片，放回
                for(let i = 0; i < countOpt; i++) {
                    let randomCard = pool[Math.floor(Math.random() * pool.length)];
                    result.push({ ...randomCard }); // 浅拷贝，避免引用污染
                }
            }
            
            // 为每组10张卡片随机挑选统一的牌背，并初始化关闭状态（确保相邻的两组牌背不重复）
            let currentCardBack;
            let lastCardBack = null;
            for (let i = 0; i < result.length; i++) {
                if (i % 10 === 0) {
                    let availableBacks = CARD_BACKS.filter(b => b !== lastCardBack);
                    currentCardBack = availableBacks[Math.floor(Math.random() * availableBacks.length)];
                    lastCardBack = currentCardBack;
                }
                result[i].isClosed = false;
                result[i].cardBack = currentCardBack;
            }
            currentCards = result;
            renderGrid(true);
        }

        // 重新学习逻辑（按顺序展示所有 109 张牌）
        function learnCards() {
            // getUniquePegs 刚好是先输出 00-00 到 00-09，再输出 0001 到 0099，完全符合 109 张的顺序要求！
            let pegs = getUniquePegs();
            
            // 为每组10张卡片随机挑选统一的牌背，并初始化关闭状态（确保相邻的两组牌背不重复）
            let currentCardBack;
            let lastCardBack = null;
            for (let i = 0; i < pegs.length; i++) {
                if (i % 10 === 0) {
                    let availableBacks = CARD_BACKS.filter(b => b !== lastCardBack);
                    currentCardBack = availableBacks[Math.floor(Math.random() * availableBacks.length)];
                    lastCardBack = currentCardBack;
                }
                pegs[i].isClosed = false;
                pegs[i].cardBack = currentCardBack;
            }
            currentCards = pegs;
            
            // 自动切换对应的 UI 选项
            document.querySelector('input[name="range"][value="all"]').checked = true;
            document.querySelector('input[name="repeat"][value="no-repeat"]').checked = true;
            document.querySelector('input[name="count"][value="120"]').checked = true;
            document.querySelector('input[name="display"][value="both"]').checked = true;
            renderGrid(true);
        }

        // 渲染格子的核心函数（支持多页横向滑动）
        function renderGrid(resetScroll = false) {
            let currentScroll = sliderWrapper.scrollLeft;

            // 如果目前没有发牌，就用选中的 count 作为格子总数占位
            let count = currentCards.length;
            if (count === 0) count = parseInt(document.querySelector('input[name="count"]:checked').value);
            
            gridSlides.innerHTML = '';
            
            let cellsPerPage = 40;
            let rowsPerPage = 8;
            let pages = Math.ceil(Math.max(count, 40) / 40);
            
            const displayOpt = document.querySelector('input[name="display"]:checked').value;
            
            for (let p = 0; p < pages; p++) {
                const pageGrid = document.createElement('div');
                pageGrid.className = 'grid-container';
                pageGrid.style.setProperty('--grid-rows', rowsPerPage);
                
                const startCell = p * cellsPerPage + 1;
                const endCell = (p + 1) * cellsPerPage;
                
                for (let i = startCell; i <= endCell; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    // 水印设置：每页的格子如果是 10 的倍数，显示为其绝对编号 (10, 20, ..., 50, 60...)
                    if (i % 10 === 0) {
                        cell.classList.add('has-bg-num');
                        cell.setAttribute('data-bg-num', i);
                    }
                    
                    const cardContent = document.createElement('div');
                    cardContent.className = 'card-content';
                    
                    const cardLabel = document.createElement('div');
                    cardLabel.className = 'card-label';
                    
                    const cardName = document.createElement('span');
                    cardName.className = 'card-name';
                    
                    const cardNum = document.createElement('span');
                    cardNum.className = 'card-num';
                    
                    // 如果当前格子有对应的卡片数据
                    if (i <= currentCards.length && currentCards[i-1]) {
                        const card = currentCards[i-1];
                        
                        cardName.textContent = card.name;
                        
                        // 动态缩小长提示词的字体，避免撑破格子
                        if (card.name.length >= 6) {
                            cardName.style.fontSize = '8px';
                            cardName.style.letterSpacing = '-0.5px';
                        } else if (card.name.length >= 4) {
                            cardName.style.fontSize = '9.5px';
                            cardName.style.letterSpacing = '-0.3px';
                        } else {
                            cardName.style.fontSize = '11px';
                            cardName.style.letterSpacing = 'normal';
                        }
                        // 00-xx 那组照旧显示两位数（01/02...），0001-0099 普通单词组去掉前导零（1/2/3...）
                        if (card.file && card.file.startsWith('00-')) {
                            cardNum.textContent = card.number; // 照旧：01, 02, 03...
                        } else {
                            cardNum.textContent = parseInt(card.number, 10).toString(); // 去前导零：1, 2, 3...
                        }
                        
                        const img = document.createElement('img');
                        
                        // 根据显示模式分发逻辑
                        if (displayOpt === 'both') {
                            // 【发号+发图】模式：使用全新的牌背与色块遮挡逻辑
                            if (card.isClosed) {
                                img.src = card.cardBack; 
                                cardLabel.classList.add('is-closed');
                                cardContent.style.visibility = 'visible';
                                cardName.style.visibility = 'visible';
                                cardNum.style.visibility = 'visible';
                            } else {
                                img.src = card.file; 
                                cardLabel.classList.remove('is-closed');
                                cardContent.style.visibility = 'visible';
                                cardName.style.visibility = 'visible';
                                cardNum.style.visibility = 'visible';
                            }
                        } else {
                            // 【只发号】或【只发图】模式：恢复以前的逻辑（点击完全揭晓，全关则完全空白）
                            img.src = card.file;
                            cardLabel.classList.remove('is-closed');
                            
                            if (card.isRevealed) {
                                // 点击揭晓后：完全显示
                                cardContent.style.visibility = 'visible';
                                cardName.style.visibility = 'visible';
                                cardNum.style.visibility = 'visible';
                            } else if (card.isClosed) {
                                // 全关状态：完全隐藏成空白格子
                                cardContent.style.visibility = 'hidden';
                                cardName.style.visibility = 'hidden';
                                cardNum.style.visibility = 'hidden';
                            } else {
                                // 默认状态：根据选项显示特定内容
                                if (displayOpt === 'number') {
                                    cardContent.style.visibility = 'hidden';
                                    cardName.style.visibility = 'hidden';
                                    cardNum.style.visibility = 'visible';
                                } else if (displayOpt === 'image') {
                                    cardContent.style.visibility = 'visible';
                                    cardName.style.visibility = 'hidden';
                                    cardNum.style.visibility = 'hidden';
                                }
                            }
                        }
                        
                        cardContent.appendChild(img);
                        
                        // 点击卡牌的互动逻辑
                        cell.style.cursor = 'pointer';
                        cell.addEventListener('click', () => {
                            if (displayOpt === 'both') {
                                card.isClosed = !card.isClosed;
                            } else {
                                // 在只发图/只发号模式下，点击用于“揭晓/隐藏”全貌
                                card.isRevealed = !card.isRevealed;
                            }
                            renderGrid();
                        });

                    } else {
                        // 空格子
                        cardName.textContent = '';
                        cardNum.textContent = '';
                    }
                    
                    cardLabel.appendChild(cardName);
                    cardLabel.appendChild(cardNum);
                    cell.appendChild(cardContent);
                    cell.appendChild(cardLabel);
                    pageGrid.appendChild(cell);
                }
                
                gridSlides.appendChild(pageGrid);
            }
            
            // 动态更新“页面”单选按钮
            let pageDots = document.querySelector('.page-dots');
            if (pageDots) {
                let html = '';
                for (let i = 0; i < pages; i++) {
                    html += `<input type="radio" name="page" value="${i}" ${i === 0 ? 'checked' : ''}> `;
                }
                pageDots.innerHTML = html;
                
                // 给新的单选框绑定点击滚动事件
                pageDots.querySelectorAll('input[name="page"]').forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        let pageIndex = parseInt(e.target.value);
                        let wrapperWidth = sliderWrapper.clientWidth;
                        sliderWrapper.scrollTo({
                            left: pageIndex * wrapperWidth,
                            behavior: 'smooth'
                        });
                    });
                });
            }
            
            if (resetScroll) {
                sliderWrapper.scrollLeft = 0;
            } else {
                sliderWrapper.scrollLeft = currentScroll;
            }
        }
        
        // 监听滑动事件，自动切换“页面”按钮的选中状态
        sliderWrapper.addEventListener('scroll', () => {
            let wrapperWidth = sliderWrapper.clientWidth;
            if (wrapperWidth === 0) return;
            let currentPage = Math.round(sliderWrapper.scrollLeft / wrapperWidth);
            let pageRadios = document.querySelectorAll('input[name="page"]');
            if (pageRadios[currentPage]) {
                pageRadios[currentPage].checked = true;
            }
        });

        // 监听单选框点击事件（操作按钮）
        const actionRadios = document.querySelectorAll('input[name="action"]');
        actionRadios.forEach(radio => {
            radio.addEventListener('click', (e) => {
                const action = e.target.value;
                if (action === 'shuffle') {
                    dealCards();
                } else if (action === 'learn') {
                    learnCards();
                } else if (action === 'close') {
                    currentCards.forEach(c => c.isClosed = true);
                    renderGrid();
                } else if (action === 'open') {
                    currentCards.forEach(c => c.isClosed = false);
                    renderGrid();
                }
                // 操作完后取消选中，使其表现得像普通按钮
                setTimeout(() => { e.target.checked = false; }, 150);
            });
        });

        // 监听其他设置项变化（例如改变“只发号”模式后实时刷新界面）
        const optionRadios = document.querySelectorAll('input[name="display"], input[name="count"], input[name="range"], input[name="repeat"]');
        optionRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                renderGrid(); 
            });
        });

        // 初始化渲染空格子
        renderGrid();
    </script>
