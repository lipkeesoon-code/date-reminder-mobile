<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <script>
    window.onerror = function(msg, url, line, col, error) {
        alert("JS Error: " + msg + " at line " + line);
        return false;
    };
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>易经占卜</title>
    <link rel="stylesheet" href="style.css?v=3.5">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* Action Card Overrides */
        .action-card .hexagram-symbol.empty {
            display: none !important;
        }
        .action-card .card-main-content {
            display: flex !important;
            gap: 15px !important;
            align-items: center !important;
            margin-top: -8px !important;
        }
        .action-card .card-title {
            width: auto !important;
            word-break: normal !important;
            white-space: nowrap !important;
            writing-mode: horizontal-tb !important;
        }
    .action-card .card-desc {
            margin-top: -5px !important;
        }
    
        /* History Popup - Injected to bypass cache */
        .history-popup {
            position: absolute;
            top: 60px;
            right: 15px;
            width: 300px;
            background: #fdfcf6;
            border: 3px solid #6b7cb8;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            max-height: 0;
            overflow-y: hidden;
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            opacity: 0;
            pointer-events: none;
        }

        .history-popup.open {
            max-height: 450px;
            opacity: 1;
            overflow-y: auto;
            pointer-events: auto;
        }

        .history-list {
            padding: 10px 15px;
        }

        .history-item {
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            padding: 12px 0 !important;
            border-bottom: 1px dashed #d5d1c8 !important;
            cursor: pointer !important;
        }

        .history-item:last-child {
            border-bottom: none !important;
        }

        .history-badge {
            width: 26px !important;
            height: 26px !important;
            border-radius: 50% !important;
            color: white !important;
            font-size: 13px !important;
            font-weight: bold !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            flex-shrink: 0 !important;
        }

        .history-text {
            font-size: 14px !important;
            color: #89827d !important;
            font-weight: bold !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }

    
        /* 备注框样式 */
        .remark-box {
            width: 100%;
            border: 3px solid #d3c3da;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: 700;
            font-family: inherit;
            color: #6d5b8e;
            background-color: #fff;
            box-sizing: border-box;
            height: 48px;
            outline: none;
            transition: border-color 0.3s;
        }
        .remark-box:focus {
            border-color: #a68ac9;
        }
        .remark-box::placeholder {
            color: rgba(128, 128, 128, 0.4);
            font-weight: 700;
        }

    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div class="app-container">
            <!-- 顶部留白，给电话、时间留空位 -->
            <div class="status-bar-spacer"></div>

            <!-- 顶部控制栏 -->
            <div class="top-controls" style="margin-top: -33px; padding: 5px 20px 10px 20px; display: flex; position: relative; z-index: 2000; justify-content: space-between; align-items: center;">
                <button class="btn-divinate" id="btn-divinate" style="margin-top: 0; height: 42px; padding: 0 12px; font-size: 18px;">
                    <span class="btn-icon" style="font-size: 22px;">☯</span>
                    易经占卜
                </button>
                <div style="display: flex; gap: 4px; align-items: center; position: relative; z-index: 3000;">
                      <img src="snapshot.png" id="snapshot-btn" alt="截图" style="width: auto; height: 40px; cursor: pointer;">
                      <img src="../设计风格/Diy .png" id="diy-toggle-btn" alt="DIY排盘" style="width: 40px; height: 40px; cursor: pointer;">
                      <img src="history.png" id="history-toggle-btn" alt="历史记录" style="width: 40px; height: 40px; cursor: pointer;">
                      <img src="../设计风格/资料.png" id="learning-toggle-btn" alt="学习资料" style="width: 40px; height: 40px; cursor: pointer;">
                  </div>
            </div>


              <!-- DIY 选择弹窗 -->
              <div id="diy-modal" class="modal-overlay" style="display: none;">
                  <div class="modal-content">
                      <div class="modal-header">
                          <h3 style="margin: 0; color: #4a3863;">DIY 占卜排盘</h3>
                          <span class="close-btn" id="diy-close-btn" style="cursor: pointer; font-size: 24px;">&times;</span>
                      </div>
                      <div class="modal-body" style="padding: 15px 0;">
                          <div class="form-group">
                              <label style="display: block; margin-bottom: 8px; color: #63537d; font-weight: bold;">选择本卦：</label>
                              <select id="diy-hex-select" class="diy-select" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; background: #f9f9f9;"></select>
                          </div>
                          
                          <div class="form-group" style="margin-top: 15px;">
                              <label style="display: block; margin-bottom: 8px; color: #63537d; font-weight: bold;">选择动爻 (单选)：</label>
                              <div class="diy-yao-selector" style="display: flex; flex-direction: column-reverse; gap: 8px; background: #f4f0f8; padding: 10px; border-radius: 8px;">
                                  <label class="diy-yao-row" style="display: flex; align-items: center; gap: 10px;"><input type="radio" name="diy_yao" value="0" checked><span>初爻 (最下)</span></label>
                                  <label class="diy-yao-row" style="display: flex; align-items: center; gap: 10px;"><input type="radio" name="diy_yao" value="1"><span>二爻</span></label>
                                  <label class="diy-yao-row" style="display: flex; align-items: center; gap: 10px;"><input type="radio" name="diy_yao" value="2"><span>三爻</span></label>
                                  <label class="diy-yao-row" style="display: flex; align-items: center; gap: 10px;"><input type="radio" name="diy_yao" value="3"><span>四爻</span></label>
                                  <label class="diy-yao-row" style="display: flex; align-items: center; gap: 10px;"><input type="radio" name="diy_yao" value="4"><span>五爻</span></label>
                                  <label class="diy-yao-row" style="display: flex; align-items: center; gap: 10px;"><input type="radio" name="diy_yao" value="5"><span>上爻 (最上)</span></label>
                              </div>
                          </div>
                          
                          <button id="diy-confirm-btn" style="margin-top: 20px; width: 100%; padding: 12px; background: linear-gradient(135deg, #7c68a6 0%, #63537d 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">开始排盘</button>
                      </div>
                  </div>
              </div>

              <!-- 历史记录下拉框 -->
              <div id="history-popup" class="history-popup">
                  <div class="history-list" id="history-list">
                      <!-- 历史记录项将由 JS 动态生成 -->
                  </div>
              </div>


            <!-- 实战页面 -->
            <div class="view-content active" id="view-practical">
                <div class="result-container" id="result-container" style="display: none; margin-top: -8px;">
                    
                    <div class="result-card primary-card">
                        <div class="card-badge">本卦现状</div>
                        <div class="card-static-desc">代表您所问之事的当前状态或初始环境。</div>
                        <div class="card-main-content">
                            <img class="hexagram-image" id="res-original-img" src="" alt="本卦图片" style="display: none;">
                            <div class="hexagram-symbol" id="res-original-symbol"></div>
                            <div class="card-hex-name" id="res-original-name">--</div>
                        </div>
                        <div class="card-desc" id="res-original-desc">释义：</div>
                    </div>

                    <div class="result-card process-card">
                        <div class="card-badge">互卦过程</div>
                        <div class="card-static-desc">代表事情内部隐藏的危机或转机。</div>
                        <div class="card-main-content">
                            <img class="hexagram-image" id="res-nuclear-img" src="" alt="互卦图片" style="display: none;">
                            <div class="hexagram-symbol" id="res-nuclear-symbol"></div>
                            <div class="card-hex-name" id="res-nuclear-name">--</div>
                        </div>
                        <div class="card-desc" id="res-nuclear-desc">释义：</div>
                    </div>

                    <div class="result-card future-card">
                        <div class="card-badge">变卦结局</div>
                        <div class="card-static-desc">代表事物的未来发展趋势或最终结局。</div>
                        <div class="card-main-content">
                            <img class="hexagram-image" id="res-changed-img" src="" alt="变卦图片" style="display: none;">
                            <div class="hexagram-symbol" id="res-changed-symbol"></div>
                            <div class="card-hex-name" id="res-changed-name">--</div>
                        </div>
                        <div class="card-desc" id="res-changed-desc">释义：</div>
                    </div>
                    <!-- 备注框 -->
                    <div style="margin-top: 15px; padding: 0 5px;">
                        <input type="text" id="divination-remark" class="remark-box" placeholder="备注" />
                    </div>


                </div>
            </div>

            <!-- 学习页面 -->
            <div class="view-content" id="view-learning" style="display: none;">
                <div class="learning-header">
                    <h2 class="learning-title">易经64卦掌握天地法则，洞悉世间万象</h2>
                </div>

                <div class="learning-legend" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; font-size: 13px; color: #554371; padding: 15px; background: #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid rgba(230, 225, 240, 1);">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span>【上上卦 / 发展顺遂，大吉之象】</span>
                        <div style="width: 14px; height: 14px; background-color: #6e943d; border-radius: 3px;"></div>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span>【中平卦 / 需待时机，稳中求胜】</span>
                        <div style="width: 14px; height: 14px; background-color: #fab041; border-radius: 3px;"></div>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span>【动荡卦 / 充满变数，需谨慎应对】</span>
                        <div style="width: 14px; height: 14px; background-color: #1688b5; border-radius: 3px;"></div>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span>【下下卦 / 陷入困境，警惕危机】</span>
                        <div style="width: 14px; height: 14px; background-color: #f06595; border-radius: 3px;"></div>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span>【其他具有特殊启示的卦】</span>
                        <div style="width: 14px; height: 14px; background-color: #866aa9; border-radius: 3px;"></div>
                    </div>
                </div>
                
                <div class="learning-list" id="learning-list">
                    <!-- JS动态填充 -->
                </div>
            </div>

            <!-- 底部导航工具栏 -->
            <nav class="bottom-nav">
                <button class="nav-btn active" id="nav-btn-yijing" title="易经">
                    <img src="../设计风格/YiJing Icon .png" alt="☯" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon" style="display:none; font-size: 24px;">☯</span>
                </button>
                <button class="nav-btn" id="nav-btn-qimen" title="奇门遁甲" onclick="window.location.href='../qimen/index.html'">
                    <img src="../设计风格/QiMen Icon .png" alt="☯" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon" style="display:none; font-size: 24px;">☯</span>
                </button>
                <button class="nav-btn" id="nav-btn-memory-game" title="记忆宫殿" onclick="window.location.href='../memory-game/index.html?v=6'">
                    <img src="../设计风格/Memory Games Icon .png" alt="🧠" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon" style="display:none; font-size: 24px;">🧠</span>
                </button>

                <button class="nav-btn" id="nav-btn-notepad" title="Notepad" onclick="window.location.href='../index.html#notepad'">
                    <img src="../设计风格/Notepad icon .png" alt="📝" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon">📝</span>
                </button>
                <button class="nav-btn" id="nav-btn-calendar" title="日历" onclick="window.location.href='../index.html'">
                    <img src="../设计风格/YueLi Icon.png" alt="📅" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon">📅</span>
                </button>
            </nav>

        </div>
    </div>

    <script src="yijing_data.js"></script>
    <script src="base64_images.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="script.js?v=4.1"></script>
</body>
</html>
