<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>易经占卜</title>
    <link rel="stylesheet" href="style.css?v=2.9">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* Action Card Overrides */
        .action-card .hexagram-symbol.empty {
            display: none !important;
        }
        .action-card .card-main-content {
            display: flex !important;
            gap: 15px !important;
            align-items: center !important;
            margin-top: -8px !important;
        }
        .action-card .card-title {
            width: auto !important;
            word-break: normal !important;
            white-space: nowrap !important;
            writing-mode: horizontal-tb !important;
        }
    .action-card .card-desc {
            margin-top: -5px !important;
        }
    
        /* History Popup - Injected to bypass cache */
        .history-popup {
            position: absolute;
            top: 60px;
            right: 15px;
            width: 300px;
            background: #fdfcf6;
            border: 3px solid #6b7cb8;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            max-height: 0;
            overflow-y: hidden;
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            opacity: 0;
            pointer-events: none;
        }

        .history-popup.open {
            max-height: 450px;
            opacity: 1;
            overflow-y: auto;
            pointer-events: auto;
        }

        .history-list {
            padding: 10px 15px;
        }

        .history-item {
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            padding: 12px 0 !important;
            border-bottom: 1px dashed #d5d1c8 !important;
            cursor: pointer !important;
        }

        .history-item:last-child {
            border-bottom: none !important;
        }

        .history-badge {
            width: 26px !important;
            height: 26px !important;
            border-radius: 50% !important;
            color: white !important;
            font-size: 13px !important;
            font-weight: bold !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            flex-shrink: 0 !important;
        }

        .history-text {
            font-size: 14px !important;
            color: #89827d !important;
            font-weight: bold !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }

    </style>
</head>

<body>
    <div class="phone-wrapper">
        <div class="app-container">
            <!-- 顶部留白，给电话、时间留空位 -->
            <div class="status-bar-spacer"></div>

            <!-- 顶部控制栏 -->
            <div class="top-controls" style="margin-top: -33px; padding: 5px 20px 10px 20px; display: flex; position: relative; z-index: 2000; justify-content: space-between; align-items: center;">
                <button class="btn-divinate" id="btn-divinate" style="margin-top: 0; height: 42px; padding: 0 24px; font-size: 19px;">
                    <span class="btn-icon" style="font-size: 22px;">☯</span>
                    易经占卜
                </button>
                <div style="display: flex; gap: 15px; align-items: center;">
                      <img src="history.png" id="history-toggle-btn" alt="历史记录" style="width: 42px; height: 42px; cursor: pointer;">
                      <img src="../设计风格/资料.png" id="learning-toggle-btn" alt="学习资料" style="width: 42px; height: 42px; cursor: pointer;">
                  </div>
            </div>

              <!-- 历史记录下拉框 -->
              <div id="history-popup" class="history-popup">
                  <div class="history-list" id="history-list">
                      <!-- 历史记录项将由 JS 动态生成 -->
                  </div>
              </div>


            <!-- 实战页面 -->
            <div class="view-content active" id="view-practical">
                <div class="result-container" id="result-container" style="display: none; margin-top: -8px;">
                    
                    <div class="result-card primary-card">
                        <div class="card-badge">现状</div>
                        <div class="card-static-desc">代表您所问之事的当前状态或初始环境。</div>
                        <div class="card-main-content">
                            <div class="card-title">本卦</div>
                            <div class="hexagram-symbol" id="res-original-symbol"></div>
                            <div class="card-hex-name" id="res-original-name">--</div>
                        </div>
                        <div class="card-desc" id="res-original-desc">释义：</div>
                    </div>

                    <div class="result-card process-card">
                        <div class="card-badge">过程</div>
                        <div class="card-static-desc">代表事情内部隐藏的危机或转机。</div>
                        <div class="card-main-content">
                            <div class="card-title">互卦</div>
                            <div class="hexagram-symbol" id="res-nuclear-symbol"></div>
                            <div class="card-hex-name" id="res-nuclear-name">--</div>
                        </div>
                        <div class="card-desc" id="res-nuclear-desc">释义：</div>
                    </div>

                    <div class="result-card action-card">
                        <div class="card-badge">行动</div>
                        <div class="card-static-desc">最精准的行动指导或警告。</div>
                        <div class="card-main-content">
                            <div class="card-title">动爻</div>
                            <div class="hexagram-symbol empty"></div>
                            <div class="card-hex-name" id="res-changing-line-name">--</div>
                        </div>
                        <div class="card-desc" id="res-changing-line-desc">释义：</div>
                    </div>

                    <div class="result-card future-card">
                        <div class="card-badge">结局</div>
                        <div class="card-static-desc">代表事物的未来发展趋势或最终结局。</div>
                        <div class="card-main-content">
                            <div class="card-title">变卦</div>
                            <div class="hexagram-symbol" id="res-changed-symbol"></div>
                            <div class="card-hex-name" id="res-changed-name">--</div>
                        </div>
                        <div class="card-desc" id="res-changed-desc">释义：</div>
                    </div>

                </div>
            </div>

            <!-- 学习页面 -->
            <div class="view-content" id="view-learning" style="display: none;">
                <div class="learning-header">
                    <h2 class="learning-title">易经64卦掌握天地法则，洞悉世间万象</h2>
                </div>
                
                <div class="learning-list" id="learning-list">
                    <!-- JS动态填充 -->
                </div>
            </div>

            <!-- 底部导航工具栏 -->
            <nav class="bottom-nav">
                <button class="nav-btn active" id="nav-btn-yijing" title="易经">
                    <img src="../设计风格/YiJing Icon .png" alt="☯" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon" style="display:none; font-size: 24px;">☯</span>
                </button>
                <button class="nav-btn" id="nav-btn-qimen" title="奇门遁甲" onclick="window.location.href='../qimen/index.html'">
                    <img src="../设计风格/QiMen Icon .png" alt="☯" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon" style="display:none; font-size: 24px;">☯</span>
                </button>
                <button class="nav-btn" id="nav-btn-memory-game" title="记忆宫殿" onclick="window.location.href='../memory-game/index.html?v=6'">
                    <img src="../设计风格/Memory Games Icon .png" alt="🧠" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon" style="display:none; font-size: 24px;">🧠</span>
                </button>

                <button class="nav-btn" id="nav-btn-notepad" title="Notepad" onclick="window.location.href='../index.html#notepad'">
                    <img src="../设计风格/Notepad icon .png" alt="📝" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon">📝</span>
                </button>
                <button class="nav-btn" id="nav-btn-calendar" title="日历" onclick="window.location.href='../index.html'">
                    <img src="../设计风格/YueLi Icon.png" alt="📅" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';" />
                    <span class="fallback-icon">📅</span>
                </button>
            </nav>

        </div>
    </div>

    <script src="yijing_data.js"></script>
    <script src="script.js?v=2.9"></script>
</body>
</html>
